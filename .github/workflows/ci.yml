name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: ["7.1", "7.2", "7.3", "7.4"]
        guzzle-versions: ["~6.2", "^7.0"]
        exclude:
          - php-versions: "7.1"
            guzzle-versions: "^7.0"
    name: Guzzle ${{ matrix.guzzle-versions }} over PHP ${{ matrix.php-versions }}

    steps:
      - name: Checkout
        uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1.2.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2 on 2026-11-26, TODO: use a release instead
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, pdo, pdo_mysql, intl, zip
          coverage: none

      - name: Fix Guzzle version
        run: composer require guzzlehttp/guzzle:"${{ matrix.guzzle-versions }}"

      - name: Install dependencies
        run: composer install

      - name: Run coding style checking
        run: composer lint

      - name: Run test suite
        run: composer test
